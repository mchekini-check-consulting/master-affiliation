user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" host=$host upstream=$upstream_addr';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # Taille max des uploads (à ajuster selon les besoins des apps)
    client_max_body_size  50m;

    # DNS interne de Docker : permet de résoudre les noms de services
    # à la requête (et de suivre les changements d'IP des conteneurs)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Un fichier de conf par application dans conf.d/
    # Le site par défaut (host inconnu / IP directe) est la landing page,
    # définie dans conf.d/landingpage.conf (default_server).
    include /etc/nginx/conf.d/*.conf;
}
