# fidexil.check-consulting.net  ->  service "fidexil-front" (port interne 80)
# Le nginx interne du frontend proxifie lui-même /api vers le backend.
server {
    listen 80;
    server_name fidexil.check-consulting.net;

    location / {
        # La variable force la résolution DNS à chaque requête :
        # nginx démarre même si cette app est arrêtée, et seule
        # cette app renvoie une erreur (502) au lieu de tout bloquer.
        set $upstream http://fidexil-front:80;
        proxy_pass $upstream;

        # En-têtes standards pour que l'app connaisse le client réel
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Support WebSocket (inoffensif si l'app n'en utilise pas)
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
