# hi-tech-academy.fr  ->  service "hi-tech-academy" (port interne 80)

# HTTP : sert le challenge ACME (Let's Encrypt) et redirige le reste en HTTPS.
server {
    listen 80;
    server_name hi-tech-academy.fr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS : terminaison TLS ici, le trafic interne vers le conteneur reste en HTTP.
server {
    listen 443 ssl;
    http2 on;
    server_name hi-tech-academy.fr;

    ssl_certificate     /etc/letsencrypt/live/hi-tech-academy.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hi-tech-academy.fr/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    location / {
        # La variable force la résolution DNS à chaque requête :
        # nginx démarre même si cette app est arrêtée.
        set $upstream http://hi-tech-academy:80;
        proxy_pass $upstream;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
