# site-a.localhost  ->  service "site-a" (port interne 80)
# TODO: remplacer par le vrai domaine quand la niche sera choisie
#       (penser aussi au "site:" dans site-a/astro.config.mjs).
server {
    listen 80;
    server_name aquascaping-facile.fr;

    location / {
        # La variable force la résolution DNS à chaque requête :
        # nginx démarre même si cette app est arrêtée.
        set $upstream http://site-a:80;
        proxy_pass $upstream;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
