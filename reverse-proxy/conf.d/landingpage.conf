# Landing page (Next.js, gérée par pm2 sur l'hôte, port 3000).
# default_server : sert aussi tout host inconnu / accès par IP,
# comme le faisait l'ancien nginx système.
# "host.docker.internal" est mappé vers l'hôte via extra_hosts
# dans docker-compose.yml.
server {
    listen 80 default_server;
    server_name _;

    location / {
        # proxy_pass statique (pas de variable) : host.docker.internal
        # n'est résolu que via /etc/hosts (extra_hosts), que le resolver
        # DNS de Docker ignore. La résolution se fait donc au démarrage,
        # sans risque : extra_hosts garantit que l'entrée existe.
        proxy_pass http://host.docker.internal:3000;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
    }
}
