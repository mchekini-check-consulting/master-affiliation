# n8n.check-consulting.net  ->  service "n8n" (port interne 5678)

# HTTP : sert le challenge ACME (Let's Encrypt) et redirige le reste en HTTPS.
server {
    listen 80;
    server_name n8n.check-consulting.net;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS : terminaison TLS ici, le trafic interne vers le conteneur reste en HTTP.
server {
    listen 443 ssl;
    http2 on;
    server_name n8n.check-consulting.net;

    ssl_certificate     /etc/letsencrypt/live/n8n.check-consulting.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/n8n.check-consulting.net/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    # L'éditeur n8n pousse les mises à jour d'exécution en temps réel
    # (websocket / SSE) : pas de timeout de lecture agressif.
    location / {
        # La variable force la résolution DNS à chaque requête :
        # nginx démarre même si cette app est arrêtée.
        set $upstream http://n8n:5678;
        proxy_pass $upstream;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
