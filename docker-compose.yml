# Docker Compose global — déploie le reverse proxy et l'ensemble des applications.
#
# Le reverse proxy est le point d'entrée unique (port 80) : il route selon le
# header Host vers la bonne application. Un fichier de conf par application
# dans reverse-proxy/conf.d/.
#
# Tout déployer           : docker compose up -d
# Déployer un seul projet : docker compose pull <service> && docker compose up -d --no-deps <service>

services:

  # ==========================================================
  # Reverse proxy — point d'entrée unique du serveur
  # ==========================================================
  reverse-proxy:
    image: nginx:1.27-alpine
    container_name: reverse-proxy
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
      - "443:443"
    volumes:
      - ./reverse-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./reverse-proxy/conf.d:/etc/nginx/conf.d:ro
      - ./reverse-proxy/snippets:/etc/nginx/snippets:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    # Recharge la conf toutes les 6h pour prendre en compte les
    # certificats renouvelés par certbot (les fichiers changent sur
    # le volume partagé, nginx doit relire).
    command: /bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g "daemon off;"'
    networks:
      - default   # sites de ce projet (hi-tech-academy, parents-malins, prepa-technique)
      - proxy     # frontends des applications (ex: fidexil-front)
    # Permet au conteneur de joindre des services qui tournent
    # directement sur l'hôte (ex: la landing page pm2 sur le port 3000)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - hi-tech-academy
      - parents-malins
      - prepa-technique
      - fidexil-front
      - my-way-front
      - qualiopilote-front

  # ==========================================================
  # Certbot — émission et renouvellement des certificats TLS
  #   Premier lancement : voir reverse-proxy/init-letsencrypt.sh
  # ==========================================================
  certbot:
    image: certbot/certbot
    container_name: certbot
    restart: unless-stopped
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    # Tente un renouvellement toutes les 12h ; certbot ne renouvelle
    # réellement qu'à J-30 de l'expiration (challenge webroot servi
    # par le reverse proxy sur /.well-known/acme-challenge/).
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done'

  # ==========================================================
  # Hi-Tech Academy (fullstack)
  #   reverse-proxy -> hi-tech-academy:80 -> (/api) hi-tech-academy-back:8080
  #                                       -> hi-tech-academy-db:5432
  # ==========================================================

  # --- Base de données -------------------------------------
  hi-tech-academy-db:
    image: postgres:16-alpine
    container_name: hi-tech-academy-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: hi_tech_academy
      POSTGRES_USER: hi_tech_academy
      POSTGRES_PASSWORD: ${HI_TECH_ACADEMY_DB_PASSWORD:-changeme}
    networks:
      - hi-tech-academy-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hi_tech_academy -d hi_tech_academy"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - hi-tech-academy-db-data:/var/lib/postgresql/data

  # --- Backend Spring Boot (demandes d'inscription) ----------
  hi-tech-academy-back:
    image: ghcr.io/mchekini-check-consulting/master-affiliation/hi-tech-academy-back:${HI_TECH_ACADEMY_BACK_TAG:-latest}
    build: ./hi-tech-academy/back
    container_name: hi-tech-academy-back
    restart: unless-stopped
    environment:
      DB_HOST: hi-tech-academy-db
      DB_PORT: "5432"
      DB_NAME: hi_tech_academy
      DB_USERNAME: hi_tech_academy
      DB_PASSWORD: ${HI_TECH_ACADEMY_DB_PASSWORD:-changeme}
      ADMIN_EMAIL: ${HI_TECH_ACADEMY_ADMIN_EMAIL:-me.chekini@gmail.com}
      ADMIN_PASSWORD: ${HI_TECH_ACADEMY_ADMIN_PASSWORD:-test}
      # Envoi d'emails (SMTP Google Workspace). Sans mot de passe, les
      # envois sont désactivés. MAIL_PASSWORD vient de .env.secrets (voir
      # ci-dessous) : le .env versionné est écrasé par le git reset --hard
      # de chaque déploiement, il ne peut pas porter de secret.
      MAIL_USERNAME: ${HI_TECH_ACADEMY_MAIL_USERNAME:-contact@hi-techacademy.fr}
    # Secrets locaux au serveur (fichier non versionné, survit aux
    # déploiements) : contient MAIL_PASSWORD=<mot de passe d'application>
    env_file:
      - path: ./.env.secrets
        required: false
    networks:
      - hi-tech-academy-net
    depends_on:
      hi-tech-academy-db:
        condition: service_healthy

  # --- Frontend React (nginx interne, proxifie /api) ---------
  hi-tech-academy:
    image: ghcr.io/mchekini-check-consulting/master-affiliation/hi-tech-academy:${HI_TECH_ACADEMY_TAG:-latest}
    build: ./hi-tech-academy
    container_name: hi-tech-academy
    restart: unless-stopped
    networks:
      - default              # joignable par le reverse proxy
      - hi-tech-academy-net  # pour proxifier /api vers le backend
    depends_on:
      - hi-tech-academy-back

  # ==========================================================
  # Sites d'affiliation
  # ==========================================================
  parents-malins:
    image: ghcr.io/mchekini-check-consulting/master-affiliation/parents-malins:${PARENTS_MALINS_TAG:-latest}
    build: ./parents-malins
    container_name: parents-malins
    restart: unless-stopped

  prepa-technique:
    image: ghcr.io/mchekini-check-consulting/master-affiliation/prepa-technique:${PREPA_TECHNIQUE_TAG:-latest}
    build: ./prepa-technique
    container_name: prepa-technique
    restart: unless-stopped

  # ==========================================================
  # Application Fidexil
  #   reverse-proxy -> fidexil-front:80 -> (/api) fidexil-back:8080
  #                                     -> fidexil-db:5432
  # ==========================================================

  # --- Base de données -------------------------------------
  fidexil-db:
    image: postgres:16-alpine
    container_name: fidexil-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: fidexil
      POSTGRES_USER: fidexil
      POSTGRES_PASSWORD: ${FIDEXIL_DB_PASSWORD:-changeme}
    networks:
      - fidexil-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fidexil -d fidexil"]
      interval: 5s
      timeout: 5s
      retries: 10
    # volumes:                                # persistance : à activer plus tard
    #   - fidexil-db-data:/var/lib/postgresql/data

  # --- Backend Spring Boot ----------------------------------
  fidexil-back:
    image: mchekini/fidexil-back:1.0
    container_name: fidexil-back
    restart: unless-stopped
    environment:
      DB_HOST: fidexil-db
      DB_PORT: "5432"
      DB_NAME: fidexil
      DB_USERNAME: fidexil
      DB_PASSWORD: ${FIDEXIL_DB_PASSWORD:-changeme}
    networks:
      - fidexil-net
    depends_on:
      fidexil-db:
        condition: service_healthy

  # --- Frontend React (nginx interne, proxifie /api) --------
  fidexil-front:
    image: mchekini/fidexil-front:1.0
    container_name: fidexil-front
    restart: unless-stopped
    environment:
      BACKEND_HOST: fidexil-back
      BACKEND_PORT: "8080"
    networks:
      - proxy         # joignable par le reverse proxy
      - fidexil-net   # pour proxifier /api vers le backend
    depends_on:
      - fidexil-back

  # ==========================================================
  # Application My Way
  #   reverse-proxy -> my-way-front:80 -> (/api) my-way-back:8080
  #                                    -> my-way-db:5432
  # ==========================================================

  # --- Base de données -------------------------------------
  my-way-db:
    image: postgres:16-alpine
    container_name: my-way-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: my_way
      POSTGRES_USER: my_way
      POSTGRES_PASSWORD: ${MY_WAY_DB_PASSWORD:-changeme}
    networks:
      - my-way-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U my_way -d my_way"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - my-way-db-data:/var/lib/postgresql/data

  # --- Backend Spring Boot ----------------------------------
  my-way-back:
    image: ghcr.io/mchekini-check-consulting/master-affiliation/my-way-back:${MY_WAY_BACK_TAG:-latest}
    build: ./my-way/back
    container_name: my-way-back
    restart: unless-stopped
    environment:
      DB_HOST: my-way-db
      DB_PORT: "5432"
      DB_NAME: my_way
      DB_USERNAME: my_way
      DB_PASSWORD: ${MY_WAY_DB_PASSWORD:-changeme}
      DOCUMENTS_DIR: /data/documents
    volumes:
      # Fichiers de l'espace documentaire (identifiants techniques, servis
      # uniquement via l'API authentifiée)
      - my-way-documents:/data/documents
    networks:
      - my-way-net
    depends_on:
      my-way-db:
        condition: service_healthy

  # --- Frontend Angular (nginx interne, proxifie /api) -------
  my-way-front:
    image: ghcr.io/mchekini-check-consulting/master-affiliation/my-way-front:${MY_WAY_FRONT_TAG:-latest}
    build: ./my-way/front
    container_name: my-way-front
    restart: unless-stopped
    networks:
      - proxy        # joignable par le reverse proxy
      - my-way-net   # pour proxifier /api vers le backend
    depends_on:
      - my-way-back

  # ==========================================================
  # Application Qualiopilote
  #   reverse-proxy -> qualiopilote-front:80 -> (/api) qualiopilote-back:8080
  #                                          -> qualiopilote-db:5432
  # ==========================================================

  # --- Base de données -------------------------------------
  qualiopilote-db:
    image: postgres:16-alpine
    container_name: qualiopilote-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: qualiopilote
      POSTGRES_USER: qualiopilote
      POSTGRES_PASSWORD: ${QUALIOPILOTE_DB_PASSWORD:-changeme}
    networks:
      - qualiopilote-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qualiopilote -d qualiopilote"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - qualiopilote-db-data:/var/lib/postgresql/data

  # --- Backend Spring Boot ----------------------------------
  qualiopilote-back:
    image: ghcr.io/mchekini-check-consulting/master-affiliation/qualiopilote-back:${QUALIOPILOTE_BACK_TAG:-latest}
    build: ./qualiopilote/back
    container_name: qualiopilote-back
    restart: unless-stopped
    environment:
      DB_HOST: qualiopilote-db
      DB_PORT: "5432"
      DB_NAME: qualiopilote
      DB_USERNAME: qualiopilote
      DB_PASSWORD: ${QUALIOPILOTE_DB_PASSWORD:-changeme}
    networks:
      - qualiopilote-net
    depends_on:
      qualiopilote-db:
        condition: service_healthy

  # --- Frontend Angular prérendu (nginx interne, proxifie /api) -------
  qualiopilote-front:
    image: ghcr.io/mchekini-check-consulting/master-affiliation/qualiopilote-front:${QUALIOPILOTE_FRONT_TAG:-latest}
    build: ./qualiopilote/front
    container_name: qualiopilote-front
    restart: unless-stopped
    networks:
      - proxy             # joignable par le reverse proxy
      - qualiopilote-net  # pour proxifier /api vers le backend
    depends_on:
      - qualiopilote-back

# ==========================================================
# Réseaux
#   default      : reverse proxy <-> sites de ce projet
#   proxy        : reverse proxy <-> frontends des applications
#   <app>-net    : réseau interne d'une application
# ==========================================================
networks:
  proxy:
    name: proxy
    # Sous-réseau fixe : la règle de pare-feu sur le serveur
    # (ufw allow from 10.0.100.0/24 to any port 3000) en dépend
    ipam:
      config:
        - subnet: 10.0.100.0/24
  fidexil-net:
    name: fidexil-net
  my-way-net:
    name: my-way-net
  hi-tech-academy-net:
    name: hi-tech-academy-net
  qualiopilote-net:
    name: qualiopilote-net

volumes:
  # Certificats Let's Encrypt (écrits par certbot, lus par le reverse proxy)
  certbot-etc:
  # Webroot du challenge ACME (écrit par certbot, servi par le reverse proxy)
  certbot-www:
  # Données PostgreSQL de My Way
  my-way-db-data:
  # Données PostgreSQL de Hi-Tech Academy (demandes d'inscription)
  hi-tech-academy-db-data:
  # Données PostgreSQL de Qualiopilote
  qualiopilote-db-data:
  # Fichiers de l'espace documentaire My Way
  my-way-documents:
#   fidexil-db-data:                          # persistance : à activer plus tard
