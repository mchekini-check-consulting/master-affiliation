spring.application.name=hi-tech-academy-back

# API servie sous /api (le nginx du front proxifie /api vers ce service)
server.servlet.context-path=/api
server.forward-headers-strategy=framework

# Base de données : configuration par variables d'environnement (compose racine)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hi_tech_academy}
spring.datasource.username=${DB_USERNAME:hi_tech_academy}
spring.datasource.password=${DB_PASSWORD:changeme}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JSON en snake_case (contrat attendu par le front)
spring.jackson.property-naming-strategy=SNAKE_CASE

management.endpoints.web.exposure.include=health

# Accès admin (basic auth) : surchager en production via variables d'environnement
app.admin.email=${ADMIN_EMAIL:me.chekini@gmail.com}
app.admin.password=${ADMIN_PASSWORD:test}

# Envoi d'emails via le SMTP Google Workspace (contact@hi-techacademy.fr).
# MAIL_PASSWORD est un « mot de passe d'application » Google, défini dans le
# .env du serveur ; s'il est vide, les envois sont simplement désactivés
# (utile en local et en tests).
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:contact@hi-techacademy.fr}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Notifications : adresse qui reçoit les nouvelles demandes d'inscription
app.mail.admin-recipient=${MAIL_ADMIN_RECIPIENT:contact@hi-techacademy.fr}

# L'email est non-critique : ne pas faire tomber le healthcheck (et donc le
# conteneur) si le SMTP est momentanément injoignable ou non configuré.
management.health.mail.enabled=false

server.error.include-message=always
