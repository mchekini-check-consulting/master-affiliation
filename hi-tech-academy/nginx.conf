server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/xml;

    # Import de sauvegarde admin (ZIP) et envoi de PDF en base64 : aligné
    # sur le reverse proxy global (50m) — le défaut (1m) rejetterait en 413.
    client_max_body_size 50m;

    # API : proxifiée vers le backend Spring Boot (même origine côté navigateur).
    # La variable + resolver forcent la résolution DNS à chaque requête :
    # nginx démarre et survit même si le backend redémarre avec une autre IP.
    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $backend http://hi-tech-academy-back:8080;
        proxy_pass $backend;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Les assets Vite sont fingerprintés : cache long
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Point d'entrée non fingerprinté : toujours revalider pour que les
    # nouveaux déploiements soient pris en compte immédiatement (évite de
    # rester bloqué sur un ancien bundle en cache).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA : react-router gère les routes côté client
    location / {
        try_files $uri $uri/ /index.html;
    }
}
