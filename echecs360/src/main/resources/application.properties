spring.application.name=echecs360
server.port=8095

# H2 en fichier : simple à lancer, schéma JPA prêt à migrer vers PostgreSQL.
# Le répertoire est surchargé en production (volume Docker) via DATA_DIR.
spring.datasource.url=jdbc:h2:file:${DATA_DIR:./data}/echecs360;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# URL publique du site (canonical, Open Graph, sitemap)
app.base-url=${APP_BASE_URL:https://echecs360.fr}

management.endpoints.web.exposure.include=health

# Sessions persistantes « rester connecté » (clé remember-me)
app.remember-me-key=${REMEMBER_ME_KEY:echecs360-remember-me}
