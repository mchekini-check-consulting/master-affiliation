<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Jouer — Échecs360</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="/app/css/app.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='16' height='16' fill='%23ebecd0'/%3E%3Crect x='16' width='16' height='16' fill='%23739552'/%3E%3Crect y='16' width='16' height='16' fill='%23739552'/%3E%3Crect x='16' y='16' width='16' height='16' fill='%23ebecd0'/%3E%3C/svg%3E">
  <!-- PWA : manifest, couleur de thème, icône iOS, service worker -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#22302a">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js').catch(function () { /* hors ligne / non supporté */ });
      });
    }
  </script>
  <!-- Contexte utilisateur + jeton CSRF pour les appels API -->
  <meta name="user-pseudo" th:content="${pseudo}">
  <meta name="chesscom-username" th:content="${chesscomUsername}">
  <meta name="_csrf" th:content="${_csrf.token}">
  <meta name="_csrf_header" th:content="${_csrf.headerName}">
</head>
<body>
<div class="layout">

  <!-- Rail de navigation (3 modes) -->
  <nav class="rail" aria-label="Modes de jeu">
    <a class="brand" href="/"><img src="/img/logo-dark.png" alt="echecs360" class="brand-img"></a>
    <div class="rail-group">Jouer</div>
    <button type="button" class="rail-item active" id="nav-two" data-mode="two">
      <span class="rail-ico">♟</span><span class="rail-label">Deux joueurs</span>
    </button>
    <button type="button" class="rail-item" id="nav-bot" data-mode="bot">
      <span class="rail-ico">🤖</span><span class="rail-label">Contre le bot</span>
    </button>
    <div class="rail-group">Progresser</div>
    <button type="button" class="rail-item" id="nav-games" data-mode="games">
      <span class="rail-ico">📈</span><span class="rail-label">Mes parties</span>
    </button>
    <button type="button" class="rail-item" id="nav-exercises" data-mode="exercises">
      <span class="rail-ico">🎯</span><span class="rail-label">Exercices intensifs</span>
      <span class="rail-badge" id="ex-progress-badge">0/0</span>
    </button>
    <button type="button" class="rail-item" id="nav-trainer" data-mode="trainer">
      <span class="rail-ico">🧩</span><span class="rail-label">Blunder Trainer</span>
    </button>
    <button type="button" class="rail-item" id="nav-misspuzzles" data-mode="misspuzzles">
      <span class="rail-ico">💡</span><span class="rail-label">Miss Puzzles</span>
    </button>
    <button type="button" class="rail-item" id="nav-missmates" data-mode="missmates">
      <span class="rail-ico">👑</span><span class="rail-label">Miss Mates</span>
    </button>
    <button type="button" class="rail-item" id="nav-openings" data-mode="openings">
      <span class="rail-ico">📖</span><span class="rail-label">Ouvertures</span>
    </button>
    <button type="button" class="rail-item" id="nav-pawns" data-mode="pawns">
      <span class="rail-ico">🧱</span><span class="rail-label">Structure de pions</span>
    </button>
    <button type="button" class="rail-item" id="nav-report" data-mode="report">
      <span class="rail-ico">📊</span><span class="rail-label">Rapport</span>
    </button>
    <div class="rail-group">Compte</div>
    <button type="button" class="rail-item" id="nav-config" data-mode="config">
      <span class="rail-ico">⚙️</span><span class="rail-label">Configuration</span>
    </button>
    <div class="spacer"></div>
    <div class="progress-card">
      <div class="progress-head"><span>Progression exercices</span><span id="progress-count">0/0</span></div>
      <div class="progress-track"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
      <span class="progress-caption" id="progress-caption"></span>
    </div>
    <div class="user-card">
      <span class="user-avatar" id="user-avatar">?</span>
      <span class="user-infos"><span class="user-name" th:text="${pseudo}">pseudo</span><span class="user-sub">Membre</span></span>
      <form th:action="@{/logout}" method="post">
        <button type="submit" class="logout" title="Se déconnecter">⏻</button>
      </form>
    </div>
  </nav>

  <!-- Zone centrale : barres joueurs + échiquier -->
  <main class="board-zone">
    <div class="player-bar black" id="bar-top">
      <span class="avatar" id="bar-top-avatar">N</span>
      <span class="name" id="bar-top-name">Noirs</span>
      <span class="turn-dot" aria-hidden="true"></span>
      <span class="captured" id="bar-top-captured"></span>
      <span class="material" id="bar-top-material"></span>
    </div>

    <div class="board-wrap">
      <!-- Barre d'évaluation (analyse des parties) : blanc en bas = avantage Blancs -->
      <div class="eval-wrap" id="eval-wrap" style="display:none" aria-label="Évaluation de la position">
        <div class="eval-bar"><div class="eval-fill" id="eval-fill"></div></div>
        <span class="eval-label" id="eval-label">0.0</span>
      </div>
      <div id="board" aria-label="Échiquier"></div>
    </div>

    <div class="player-bar white to-move" id="bar-bottom">
      <span class="avatar" id="bar-bottom-avatar">B</span>
      <span class="name" id="bar-bottom-name">Blancs</span>
      <span class="turn-dot" aria-hidden="true"></span>
      <span class="captured" id="bar-bottom-captured"></span>
      <span class="material" id="bar-bottom-material"></span>
    </div>

    <!-- Rapport : remplace l'échiquier et occupe toute la zone centrale -->
    <div class="report-main" id="report-main" style="display:none"></div>
  </main>

  <!-- Panneau latéral : statut, coups, contrôles -->
  <aside class="side">
    <!-- Signaux de la position : commentaire façon chess.com, en haut à droite -->
    <div class="signals-panel" id="signals-panel" style="display:none"></div>

    <div class="status"><span id="status-main">Trait aux Blancs</span><span class="sub" id="status-sub"></span></div>

    <div class="thinking" id="thinking"><span class="dot"></span> Le bot réfléchit…</div>

    <div class="replay-nav" id="replay-nav" style="display:none">
      <button type="button" class="btn btn-secondary" id="nav-first" title="Début">⏮</button>
      <button type="button" class="btn btn-secondary" id="nav-prev" title="Coup précédent">◀</button>
      <button type="button" class="btn btn-secondary" id="nav-next" title="Coup suivant">▶</button>
      <button type="button" class="btn btn-secondary" id="nav-last" title="Fin">⏭</button>
    </div>

    <div id="eval-graph-wrap">
      <canvas id="eval-graph" width="600" height="168"></canvas>
    </div>
    <div class="analysis-progress" id="analysis-progress" style="display:none"></div>
    <div class="analysis-summary" id="analysis-summary"></div>

    <!-- Explication « humaine » du coup courant (relecture de partie) -->
    <div class="move-explain" id="move-explain" style="display:none"></div>

    <!-- Signaux faibles de la position (relecture + Blunder Trainer) -->
    <button type="button" class="btn btn-secondary btn-signals" id="btn-signals" style="display:none">🔍 Signaux de la position</button>
    <button type="button" class="btn btn-secondary btn-signals" id="btn-signals-visual" style="display:none">👁 Visite des signaux</button>

    <div class="ex-toolbar" id="ex-toolbar" style="display:none">
      <button type="button" class="btn btn-secondary" id="ex-back" title="Retour à la liste">⬅ Liste</button>
      <button type="button" class="btn btn-secondary" id="ex-prev" title="Exercice précédent">◀</button>
      <button type="button" class="btn btn-secondary" id="ex-next" title="Exercice suivant">▶</button>
      <button type="button" class="btn btn-secondary" id="ex-restart">Recommencer</button>
      <button type="button" class="btn btn-secondary" id="ex-hint">Indice</button>
      <button type="button" class="btn btn-secondary" id="ex-solution">Solution</button>
      <button type="button" class="btn btn-primary" id="ex-explain">💡 Explication</button>
      <button type="button" class="btn btn-primary wide" id="ex-steps" style="display:none">🎓 Voir les étapes de résolution</button>
    </div>
    <div class="ex-explanation" id="ex-explanation" style="display:none"></div>

    <!-- Visionneuse pas à pas : cases couvertes / cases du roi / coup joué -->
    <div class="ex-steps-panel" id="ex-steps-panel" style="display:none">
      <div class="ex-steps-head">
        <span id="ex-steps-count">Étape 0/0</span>
        <button type="button" class="ex-steps-quit" id="ex-steps-quit">✕ Quitter</button>
      </div>
      <!-- Contrôles au-dessus du texte : ils ne bougent pas quand le
           commentaire change de longueur -->
      <div class="ex-steps-nav">
        <button type="button" class="btn btn-secondary" id="ex-steps-prev">◀ Précédente</button>
        <button type="button" class="btn btn-primary" id="ex-steps-next">Suivante ▶</button>
      </div>
      <div class="anim-row">
        <button type="button" class="btn btn-primary" id="ex-steps-lecture">▶ Lecture auto</button>
        <select class="anim-duree" id="ex-steps-duree" title="Cadence de la lecture automatique">
          <option value="1">1 s / coup</option>
          <option value="2" selected>2 s / coup</option>
          <option value="3">3 s / coup</option>
          <option value="5">5 s / coup</option>
        </select>
      </div>
      <div class="ex-steps-legend">
        <span class="lg"><i class="lg-swatch lg-free"></i>Cases où le roi peut encore aller</span>
        <span class="lg"><i class="lg-swatch lg-move"></i>Coup joué · la flèche montre le prochain coup</span>
        <label class="lg ex-steps-toggle">
          <input type="checkbox" id="ex-steps-covered">
          <i class="lg-swatch lg-covered"></i>Afficher les cases contrôlées (interdites au roi)
        </label>
      </div>
      <div class="ex-steps-caption" id="ex-steps-caption"></div>
    </div>

    <div class="moves" id="moves" aria-label="Liste des coups"></div>

    <div class="exercises-panel" id="exercises-panel" style="display:none">
      <div class="ex-tabs">
        <button type="button" class="ex-tab active" data-filter="mats">Mats</button>
        <button type="button" class="ex-tab" data-filter="finales">Finales</button>
      </div>
      <div class="ex-cards" id="ex-cards"></div>
    </div>

    <div class="games-panel" id="games-panel" style="display:none"></div>

    <!-- Blunder Trainer : quiz sur les gaffes de vos parties chess.com -->
    <div class="trainer-panel" id="trainer-panel" style="display:none"></div>

    <!-- Miss Puzzles : les avantages laissés filer, à retrouver -->
    <div class="trainer-panel" id="misspuzzles-panel" style="display:none"></div>

    <!-- Miss Mates : les mats en 1 à 3 coups ratés, à rejouer -->
    <div class="trainer-panel" id="missmates-panel" style="display:none"></div>

    <!-- Configuration : pseudo chess.com et chargement des parties -->
    <div class="config-panel" id="config-panel" style="display:none"></div>

    <!-- Ouvertures : répertoire Blancs / Noirs, lignes commentées -->
    <div class="openings-panel" id="openings-panel" style="display:none"></div>

    <!-- Structure de pions : notions, structures types et exercices -->
    <div class="openings-panel" id="pawns-panel" style="display:none"></div>

    <div class="controls" id="controls">
      <button type="button" class="btn btn-primary" id="btn-new">Nouvelle partie</button>
      <button type="button" class="btn btn-secondary" id="btn-undo">Annuler</button>
      <button type="button" class="btn btn-secondary" id="btn-flip">Retourner</button>
      <button type="button" class="btn btn-primary" id="btn-analyze" style="display:none">Analyser la partie</button>
    </div>
  </aside>
</div>

<!-- Les modales (config bot, import chess.com, fin de partie) sont créées par app.js -->
<script src="/app/js/pieces.js"></script>
<script src="/app/js/engine.js"></script>
<script src="/app/js/pgn.js"></script>
<script src="/app/js/signals.js"></script>
<script src="/app/js/move-classifier.js"></script>
<script src="/app/js/weak-signal.js"></script>
<script src="/app/js/sf-engine.js"></script>
<script src="/app/js/exercises-data.js"></script>
<script src="/app/js/openings-data.js"></script>
<script src="/app/js/pawns-data.js"></script>
<script src="/app/js/app.js"></script>
</body>
</html>
