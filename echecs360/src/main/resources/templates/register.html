<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{fragments :: metaHead(${metaTitle}, ${metaDescription}, ${canonical})}"></th:block>
  <meta name="robots" content="noindex">
</head>
<body>
<header th:replace="~{fragments :: header}"></header>

<main class="auth-wrap">
  <div class="auth-card">
    <h1>Créer un compte</h1>

    <form th:action="@{/register}" th:object="${form}" method="post">
      <div class="field">
        <label for="email">Adresse email</label>
        <input type="email" id="email" th:field="*{email}" required autocomplete="email" autofocus>
        <p class="error" th:each="err : ${#fields.errors('email')}" th:text="${err}">Erreur email</p>
      </div>
      <div class="field">
        <label for="pseudo">Pseudo</label>
        <input type="text" id="pseudo" th:field="*{pseudo}" required autocomplete="nickname"
               minlength="2" maxlength="30">
        <p class="error" th:each="err : ${#fields.errors('pseudo')}" th:text="${err}">Erreur pseudo</p>
      </div>
      <div class="field">
        <label for="password">Mot de passe <small>(8 caractères minimum)</small></label>
        <input type="password" id="password" th:field="*{password}" required
               autocomplete="new-password" minlength="8">
        <p class="error" th:each="err : ${#fields.errors('password')}" th:text="${err}">Erreur mot de passe</p>
      </div>
      <button type="submit" class="btn btn-primary">Créer mon compte</button>
    </form>

    <p class="auth-alt">Déjà inscrit ? <a href="/login">Se connecter</a></p>
  </div>
</main>

<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
