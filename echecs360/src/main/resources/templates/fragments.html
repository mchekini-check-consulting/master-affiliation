<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <!-- Fragment <head> commun : title/description uniques, canonical, OG/Twitter -->
  <th:block th:fragment="metaHead(title, description, canonical)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">Échecs360</title>
    <meta name="description" th:content="${description}">
    <link rel="canonical" th:href="${canonical}">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Échecs360">
    <meta property="og:title" th:content="${title}">
    <meta property="og:description" th:content="${description}">
    <meta property="og:url" th:content="${canonical}">
    <meta property="og:locale" content="fr_FR">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" th:content="${title}">
    <meta name="twitter:description" th:content="${description}">
    <link rel="stylesheet" href="/css/site.css">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='16' height='16' fill='%23ebecd0'/%3E%3Crect x='16' width='16' height='16' fill='%23739552'/%3E%3Crect y='16' width='16' height='16' fill='%23739552'/%3E%3Crect x='16' y='16' width='16' height='16' fill='%23ebecd0'/%3E%3C/svg%3E">
  </th:block>
</head>
<body>

<!-- En-tête commun -->
<header class="site-header" th:fragment="header">
  <div class="container">
    <a href="/" class="brand"><img src="/img/logo-light.png" alt="Échecs360" class="brand-img"></a>
    <nav class="site-nav" aria-label="Navigation principale">
      <a href="/blog">Blog</a>
      <a href="/login" sec:authorize="!isAuthenticated()"
         xmlns:sec="http://www.thymeleaf.org/extras/spring-security">Se connecter</a>
      <a href="/register" class="btn btn-primary" sec:authorize="!isAuthenticated()"
         xmlns:sec="http://www.thymeleaf.org/extras/spring-security">Créer un compte</a>
      <a href="/app" class="btn btn-primary" sec:authorize="isAuthenticated()"
         xmlns:sec="http://www.thymeleaf.org/extras/spring-security">Jouer</a>
    </nav>
  </div>
</header>

<!-- Pied de page commun -->
<footer class="site-footer" th:fragment="footer">
  <div class="container">
    <p>© 2026 Échecs360 — Apprenez les échecs en jouant.</p>
    <nav aria-label="Liens de bas de page">
      <a href="/blog">Blog</a>
      <a href="/register">Créer un compte</a>
      <a href="mailto:contact@echecs360.fr">Contact</a>
    </nav>
  </div>
</footer>

</body>
</html>
