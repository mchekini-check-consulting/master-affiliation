spring.application.name=natura-prep-back

# API servie sous /api (le nginx du front proxifie /api vers ce service)
server.servlet.context-path=/api

# Base de données : configuration par variables d'environnement (compose racine)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:natura_prep}
spring.datasource.username=${DB_USERNAME:natura_prep}
spring.datasource.password=${DB_PASSWORD:changeme}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JSON en snake_case (même contrat que les autres applications du monorepo)
spring.jackson.property-naming-strategy=SNAKE_CASE

management.endpoints.web.exposure.include=health
server.error.include-message=always

# Cookie de session : même origine uniquement (protège les POST JSON,
# le CSRF étant désactivé côté API)
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Simulation d'entretien : clé OpenAI (reste côté serveur) et modèles.
# Les prix d'évaluation sont en dollars par million de tokens.
simulation.openai-cle=${OPENAI_API_KEY:}
simulation.modele-mini=${SIMULATION_MODELE_MINI:gpt-realtime-mini}
simulation.modele-flagship=${SIMULATION_MODELE_FLAGSHIP:gpt-realtime}
simulation.modele-transcription=${SIMULATION_MODELE_TRANSCRIPTION:gpt-4o-mini-transcribe}
simulation.modele-evaluation=${SIMULATION_MODELE_EVALUATION:gpt-5-mini}
simulation.prix-evaluation-entree-usd=${SIMULATION_PRIX_EVAL_ENTREE:0.25}
simulation.prix-evaluation-sortie-usd=${SIMULATION_PRIX_EVAL_SORTIE:2.00}
