<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Connexion — Natura Prep</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231e2b9e'/%3E%3Ctext x='16' y='21.5' font-family='Arial,sans-serif' font-size='13' font-weight='800' fill='%23fff' text-anchor='middle'%3ENP%3C/text%3E%3C/svg%3E" />
    <script type="module" src="/src/connexion.js"></script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1e2b9e" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Natura Prep" />
  </head>
  <body class="page-auth">
    <main class="auth">
      <a href="/" class="auth-logo">
        <img src="/logo.png" alt="Natura Prep" />
      </a>
      <div class="auth-carte">
        <h1>Se connecter</h1>
        <p class="auth-sous">Retrouvez vos cours, quiz et simulations.</p>

        <p class="auth-alerte" data-alerte hidden></p>

        <form data-form-connexion>
          <label class="champ">
            <span>Adresse email</span>
            <input type="email" name="email" required autocomplete="email" autofocus />
          </label>
          <label class="champ">
            <span>Mot de passe</span>
            <input type="password" name="mot_de_passe" required autocomplete="current-password" />
          </label>
          <button type="submit" class="auth-bouton" data-bouton>Se connecter</button>
        </form>

        <p class="auth-alt">Pas encore de compte ? <a href="/inscription/">Créer un compte gratuit</a></p>
      </div>
    </main>
  </body>
</html>
