<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mon espace — Natura Prep</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231e2b9e'/%3E%3Ctext x='16' y='21.5' font-family='Arial,sans-serif' font-size='13' font-weight='800' fill='%23fff' text-anchor='middle'%3ENP%3C/text%3E%3C/svg%3E" />
    <script type="module" src="/src/espace.js"></script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1e2b9e" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Natura Prep" />
  </head>
  <body class="page-espace">
    <div class="espace" data-espace hidden>
      <!-- Barre latérale -->
      <aside class="lateral">
        <a class="lateral-logo" href="/">
          <span class="lateral-monogramme" aria-hidden="true">NP</span>
          <span class="lateral-nom">Natura Prep</span>
        </a>

        <nav class="lateral-nav" aria-label="Espace membre">
          <button type="button" class="lateral-lien" data-section="cours">
            <span aria-hidden="true">📚</span> Cours
          </button>
          <button type="button" class="lateral-lien" data-section="quizz">
            <span aria-hidden="true">✅</span> Quizz
          </button>
          <button type="button" class="lateral-lien" data-section="simulations">
            <span aria-hidden="true">🎙️</span> Simulations d'entretiens
          </button>
          <button type="button" class="lateral-lien" data-section="rapports">
            <span aria-hidden="true">📊</span> Rapports
          </button>
        </nav>

        <div class="lateral-pied">
          <div class="lateral-membre">
            <span class="lateral-avatar" data-avatar aria-hidden="true">·</span>
            <span class="lateral-infos">
              <span class="lateral-membre-nom" data-nom>…</span>
              <span class="lateral-membre-email" data-email></span>
            </span>
          </div>
          <button type="button" class="lateral-deconnexion" data-deconnexion>
            Se déconnecter
          </button>
        </div>
      </aside>

      <!-- Contenu -->
      <main class="contenu">
        <section class="panneau" data-panneau="cours" hidden>
          <div data-cours></div>
        </section>

        <section class="panneau" data-panneau="quizz" hidden>
          <div data-quizz></div>
        </section>

        <section class="panneau" data-panneau="simulations" hidden>
          <div data-simulations></div>
        </section>

        <section class="panneau" data-panneau="rapports" hidden>
          <div data-rapports></div>
        </section>
      </main>
    </div>
  </body>
</html>
