spring.application.name=my-way-back

# API servie sous /api (le nginx du front proxifie /api vers ce service)
server.servlet.context-path=/api
server.forward-headers-strategy=framework

# Base de données : configuration par variables d'environnement (compose racine)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:my_way}
spring.datasource.username=${DB_USERNAME:my_way}
spring.datasource.password=${DB_PASSWORD:changeme}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JSON en snake_case (contrat attendu par le front)
spring.jackson.property-naming-strategy=SNAKE_CASE

management.endpoints.web.exposure.include=health
