spring.application.name=qualiopilote-back

# API servie sous /api (le nginx du front proxifie /api vers ce service)
server.servlet.context-path=/api

# Base de données : configuration par variables d'environnement (compose racine)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:qualiopilote}
spring.datasource.username=${DB_USERNAME:qualiopilote}
spring.datasource.password=${DB_PASSWORD:changeme}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JSON en snake_case (contrat attendu par le front)
spring.jackson.property-naming-strategy=SNAKE_CASE

management.endpoints.web.exposure.include=health
server.error.include-message=always

# Seed initial : organisme de démonstration + compte OWNER
app.seed.enabled=${SEED_ENABLED:true}
app.seed.org-nom=${SEED_ORG_NOM:Organisme de démonstration}
app.seed.org-slug=${SEED_ORG_SLUG:demo}
app.seed.owner-email=${SEED_OWNER_EMAIL:demo@qualiopilote.fr}
app.seed.owner-password=${SEED_OWNER_PASSWORD:demo}
