spring.datasource.url=jdbc:h2:mem:qualiopilote;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jackson.property-naming-strategy=SNAKE_CASE

# Pas de seed automatique : les tests amorcent leurs propres données
app.seed.enabled=false
app.seed.org-nom=Test
app.seed.org-slug=test
app.seed.owner-email=test@test.fr
app.seed.owner-password=test
