<div class="page">
  <form class="card" [formGroup]="form" (ngSubmit)="soumettre()">
    <a routerLink="/" class="brand">
      <span class="brand-mark">Q</span>
      <span class="brand-name">Qualiopilote</span>
    </a>

    <h1>Connexion à votre espace</h1>
    <p class="subtitle">Accédez au back-office de votre organisme de formation.</p>

    <label>
      <span class="lbl">Adresse e-mail</span>
      <input type="email" formControlName="identifiant" autocomplete="username" placeholder="vous@organisme.fr" />
    </label>

    <label>
      <span class="lbl">Mot de passe</span>
      <input type="password" formControlName="motDePasse" autocomplete="current-password" placeholder="••••••••" />
    </label>

    @if (erreur()) {
      <p class="error">Adresse e-mail ou mot de passe incorrect.</p>
    }

    <button type="submit" class="btn-primary" [disabled]="enCours()">
      <lucide-icon name="log-in" [size]="18" />
      {{ enCours() ? 'Connexion…' : 'Se connecter' }}
    </button>

    <p class="hint">Compte de démonstration : <strong>demo&#64;qualiopilote.fr</strong> / <strong>demo</strong></p>
  </form>
</div>
