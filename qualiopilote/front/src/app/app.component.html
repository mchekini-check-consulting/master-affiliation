<main class="hello">
  <section class="card">
    <span class="badge">Qualiopilote</span>
    <h1>{{ staticMessage }}</h1>
    <p class="subtitle">
      Application Angular (prérendu SEO) + Spring Boot + PostgreSQL.
    </p>

    <button type="button" (click)="callBackend()">Appeler le back-end</button>

    <p class="api" *ngIf="apiMessage">✅ {{ apiMessage }}</p>
    <p class="api error" *ngIf="apiError">❌ Impossible de joindre le back-end.</p>
  </section>
</main>
