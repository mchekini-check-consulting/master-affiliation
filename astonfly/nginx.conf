server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/xml;

    # API du backend (articles, catégories, événements, médias). ^~ : prime sur
    # la regex des extensions (les images servies par l'API ont un .jpg/.png).
    location ^~ /api/ {
        resolver 127.0.0.11 valid=30s;
        set $backend http://astonfly-back:8080;
        proxy_pass $backend;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 12m;
    }

    # Les assets Astro sont fingerprintés : cache long
    location ^~ /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Admin : pas de cache long (les mises à jour doivent être immédiates)
    location ^~ /admin/ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html =404;
    }

    # Fichiers statiques (photos, modèles 3D, JS, PDF…) : cache 7 jours,
    # 404 s'ils n'existent pas (pas de fallback SPA sur les assets)
    location ~ \.(png|jpe?g|webp|gif|svg|ico|css|js|mjs|json|glb|pdf|mp4|webm|xml|txt|woff2?)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Versions linguistiques (SPA : toute URL sous /xx/ sert la page de la langue)
    location ~ ^/(en|pt|es|it|de)/ {
        try_files $uri $uri/index.html /$1/index.html;
    }

    # SPA React (dc-runtime) : les URL du site (/admissions/, /formation-…)
    # sont des routes internes, on sert index.html en fallback
    location / {
        try_files $uri $uri/index.html $uri.html /index.html;
    }
}
