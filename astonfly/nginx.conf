server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/xml;

    # Les assets Astro sont fingerprintés : cache long
    location ^~ /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Fichiers statiques (photos, modèles 3D, JS, PDF…) : cache 7 jours,
    # 404 s'ils n'existent pas (pas de fallback SPA sur les assets)
    location ~ \.(png|jpe?g|webp|gif|svg|ico|css|js|mjs|json|glb|pdf|mp4|webm|xml|txt|woff2?)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Version anglaise (SPA : toute URL sous /en/ sert la page anglaise)
    location /en/ {
        try_files $uri $uri/index.html /en/index.html;
    }

    # SPA React (dc-runtime) : les URL du site (/admissions/, /formation-…)
    # sont des routes internes, on sert index.html en fallback
    location / {
        try_files $uri $uri/index.html $uri.html /index.html;
    }
}
