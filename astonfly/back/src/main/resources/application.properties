spring.application.name=astonfly-back

# API servie sous /api (le nginx du front proxifie /api vers ce service)
server.servlet.context-path=/api

# Base de données : configuration par variables d'environnement (compose racine)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:astonfly}
spring.datasource.username=${DB_USERNAME:astonfly}
spring.datasource.password=${DB_PASSWORD:changeme}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health
server.error.include-message=always

# Accès admin (Basic Auth, même pattern que hi-tech-academy)
app.admin.email=${ADMIN_EMAIL:me.chekini@gmail.com}
app.admin.password=${ADMIN_PASSWORD:test}

# Images uploadées depuis l'admin
app.media.dir=${MEDIA_DIR:./data/media}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Traduction automatique des contenus (OpenAI). Sans clé, la traduction est
# désactivée : le contenu source est copié tel quel avec un avertissement.
# Coût gpt-5 : ~0,7 ¢ par langue pour un article de ~300 mots (~3,5 ¢ pour les
# 5 langues). gpt-5-mini (5× moins cher) est retiré par OpenAI le 11/12/2026.
traduction.openai-api-key=${OPENAI_API_KEY:}
traduction.modele=${TRADUCTION_MODELE:gpt-5}
