spring.application.name=immo-scrapper-back

# API servie sous /api (le nginx du front proxifie /api vers ce service)
server.servlet.context-path=/api

# Base de données : configuration par variables d'environnement (compose racine)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:immo_scrapper}
spring.datasource.username=${DB_USERNAME:immo_scrapper}
spring.datasource.password=${DB_PASSWORD:changeme}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JSON en snake_case (même contrat que les autres applications du monorepo)
spring.jackson.property-naming-strategy=SNAKE_CASE

management.endpoints.web.exposure.include=health
server.error.include-message=always
