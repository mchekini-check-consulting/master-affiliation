# Pipeline du projet natura-prep : ne se déclenche que si natura-prep/ change sur main.
# Fullstack : build des 2 images (front + back) puis redémarrage des services
# du projet uniquement (la BDD est créée au premier déploiement).
name: natura-prep

on:
  push:
    branches: [main]
    paths:
      - "natura-prep/**"
      - ".github/workflows/natura-prep.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & push natura-prep ${{ matrix.component.image }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component:
          # Le front vit à la racine du dossier, le back dans back/
          - { image: natura-prep, context: ./natura-prep/front }
          - { image: natura-prep-back, context: ./natura-prep/back }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component.context }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.component.image }}:latest
            ghcr.io/${{ github.repository }}/${{ matrix.component.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component.image }}
          cache-to: type=gha,scope=${{ matrix.component.image }},mode=max

  deploy:
    name: Deploy natura-prep sur la VM
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Redémarrer uniquement les services du projet
        uses: appleboy/ssh-action@v1
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          # Blips réseau runner -> VM : on laisse plus de 30s (défaut) pour
          # établir la connexion, avec quelques tentatives
          timeout: 90s
          envs: OPENAI_API_KEY
          script: |
            set -e
            REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
            if [ ! -d /opt/master-affiliation/.git ]; then
              sudo mkdir -p /opt/master-affiliation
              sudo chown "$(id -u):$(id -g)" /opt/master-affiliation
              git clone "$REPO_URL" /opt/master-affiliation
            fi
            cd /opt/master-affiliation
            git remote set-url origin "$REPO_URL"
            git fetch origin main
            git reset --hard origin/main
            # Secrets d'exécution : maintenus dans le .env du serveur (lu par
            # docker compose), jamais versionnés ; mise à jour idempotente
            touch .env
            grep -v '^OPENAI_API_KEY=' .env > .env.tmp || true
            printf 'OPENAI_API_KEY=%s\n' "$OPENAI_API_KEY" >> .env.tmp
            mv .env.tmp .env
            chmod 600 .env
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            # Retry : les images tout juste poussées peuvent mettre quelques
            # secondes à être disponibles sur GHCR
            for i in 1 2 3 4 5; do
              docker compose pull natura-prep natura-prep-back && break
              echo "pull raté (tentative $i), nouvel essai dans 15s..." && sleep 15
            done
            docker compose up -d natura-prep-db natura-prep-back natura-prep
            docker image prune -f
