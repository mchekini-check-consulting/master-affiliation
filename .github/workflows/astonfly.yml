# Pipeline du projet astonfly : ne se déclenche que si astonfly/ change sur main.
# Fullstack : build des 2 images (front + back) puis redémarrage des services
# du projet uniquement (la BDD est créée au premier déploiement).
name: astonfly

on:
  push:
    branches: [main]
    paths:
      - "astonfly/**"
      - ".github/workflows/astonfly.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & push ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: astonfly
            contexte: ./astonfly
          - image: astonfly-back
            contexte: ./astonfly/back
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.contexte }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.image }}:latest
            ghcr.io/${{ github.repository }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  deploy:
    name: Deploy astonfly sur la VM
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Redémarrer uniquement les services du projet
        uses: appleboy/ssh-action@v1
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ASTONFLY_ADMIN_PASSWORD: ${{ secrets.ASTONFLY_ADMIN_PASSWORD }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          timeout: 90s
          envs: OPENAI_API_KEY,ASTONFLY_ADMIN_PASSWORD
          script: |
            set -e
            REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
            if [ ! -d /opt/master-affiliation/.git ]; then
              sudo mkdir -p /opt/master-affiliation
              sudo chown "$(id -u):$(id -g)" /opt/master-affiliation
              git clone "$REPO_URL" /opt/master-affiliation
            fi
            cd /opt/master-affiliation
            git remote set-url origin "$REPO_URL"
            git fetch origin main
            git reset --hard origin/main
            # Secrets runtime maintenus dans le .env du serveur (écrasé par le
            # git reset) : mise à jour idempotente seulement s'ils sont définis
            for VAR in OPENAI_API_KEY ASTONFLY_ADMIN_PASSWORD; do
              VAL="$(eval echo "\$$VAR")"
              if [ -n "$VAL" ]; then
                touch .env
                grep -v "^$VAR=" .env > .env.tmp || true
                printf '%s=%s\n' "$VAR" "$VAL" >> .env.tmp
                mv .env.tmp .env
                chmod 600 .env
              fi
            done
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            # Retry : les images tout juste poussées peuvent mettre quelques
            # secondes à être disponibles sur GHCR
            for i in 1 2 3 4 5; do
              docker compose pull astonfly astonfly-back && break
              echo "pull raté (tentative $i), nouvel essai dans 15s..." && sleep 15
            done
            docker compose up -d astonfly-db astonfly-back astonfly
            docker image prune -f
