# Pipeline du projet my-way : ne se déclenche que si my-way/ change sur main.
# Fullstack : build des 2 images (back + front) puis redémarrage des services
# du projet uniquement (la BDD est créée au premier déploiement).
name: my-way

on:
  push:
    branches: [main]
    paths:
      - "my-way/**"
      - ".github/workflows/my-way.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & push my-way-${{ matrix.component }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [back, front]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: ./my-way/${{ matrix.component }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/my-way-${{ matrix.component }}:latest
            ghcr.io/${{ github.repository }}/my-way-${{ matrix.component }}:${{ github.sha }}
          cache-from: type=gha,scope=my-way-${{ matrix.component }}
          cache-to: type=gha,scope=my-way-${{ matrix.component }},mode=max

  deploy:
    name: Deploy my-way sur la VM
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Redémarrer uniquement les services du projet
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e
            REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
            if [ ! -d /opt/master-affiliation/.git ]; then
              sudo mkdir -p /opt/master-affiliation
              sudo chown "$(id -u):$(id -g)" /opt/master-affiliation
              git clone "$REPO_URL" /opt/master-affiliation
            fi
            cd /opt/master-affiliation
            git remote set-url origin "$REPO_URL"
            git fetch origin main
            git reset --hard origin/main
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            # Retry : les images tout juste poussées peuvent mettre quelques
            # secondes à être disponibles sur GHCR
            for i in 1 2 3 4 5; do
              docker compose pull my-way-back my-way-front && break
              echo "pull raté (tentative $i), nouvel essai dans 15s..." && sleep 15
            done
            docker compose up -d my-way-db my-way-back my-way-front
            docker image prune -f
