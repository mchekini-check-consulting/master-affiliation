# Pipeline du projet prepa-technique : ne se déclenche que si prepa-technique/ change sur main.
name: prepa-technique

on:
  push:
    branches: [main]
    paths:
      - "prepa-technique/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-project.yml
    with:
      project: prepa-technique
    secrets: inherit
